name: TUI Screenshots

on:
  pull_request:
    branches: [ "mainline" ]
    paths:
      - 'src/tui.rs'
      - 'src/bin/tui.rs'
      - 'src/bin/tui_snapshot.rs'
      - 'src/card/**'
      - 'src/game/**'
      - 'src/action/**'
      - 'Cargo.toml'

env:
  CARGO_TERM_COLOR: always

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - uses: actions/checkout@v4

    - name: Cache cargo registry and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-tui-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-tui-

    - name: Build snapshot generator
      run: cargo build --features tui --bin tui_snapshot

    - name: Generate snapshots (kinnan)
      run: cargo run --features tui --bin tui_snapshot -- --preset kinnan --output-dir tui_screenshots/kinnan --cols 100 --rows 35

    - name: Generate snapshots (red)
      run: cargo run --features tui --bin tui_snapshot -- --preset red --output-dir tui_screenshots/red --cols 100 --rows 35

    - name: Upload SVGs as artifact
      uses: actions/upload-artifact@v4
      with:
        name: tui-screenshots
        path: tui_screenshots/
        retention-days: 30

    - name: Comment on PR with embedded ANSI screenshots
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const sha = '${{ github.event.pull_request.head.sha }}'.substring(0, 7);

          function readAnsiFiles(dir, prefix) {
            const files = fs.readdirSync(dir)
              .filter(f => f.endsWith('.ansi'))
              .sort();
            return files.map(f => ({
              name: f.replace('.ansi', '')
                     .replace(new RegExp(`^${prefix}_\\d+_`), '')
                     .replace(/_/g, ' '),
              content: fs.readFileSync(path.join(dir, f), 'utf8'),
            }));
          }

          const kinnan = readAnsiFiles('tui_screenshots/kinnan', 'kinnan');
          const red = readAnsiFiles('tui_screenshots/red', 'red');

          let body = '## TUI Screenshots\n\n';
          body += `Auto-generated at commit \`${sha}\`. Click to expand each scenario.\n\n`;

          body += '### Kinnan (Commander)\n\n';
          for (const s of kinnan) {
            body += `<details>\n<summary><b>${s.name}</b></summary>\n\n`;
            body += '```ansi\n' + s.content + '```\n\n';
            body += '</details>\n\n';
          }

          body += '### Red Aggro (Standard)\n\n';
          for (const s of red) {
            body += `<details>\n<summary><b>${s.name}</b></summary>\n\n`;
            body += '```ansi\n' + s.content + '```\n\n';
            body += '</details>\n\n';
          }

          body += '*Full SVGs also available in the **tui-screenshots** build artifact.*\n';

          // Find existing bot comment to update (avoid duplicates)
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c =>
            c.user.type === 'Bot' && c.body.includes('## TUI Screenshots')
          );
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
