[package]
name = "mtg-gto"
version = "0.1.0"
edition = "2021"

[features]
default = []
scryfall = ["ureq"]
tui = ["ratatui", "crossterm"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rayon = "1.8"
bincode = "1"
ureq = { version = "2", features = ["json"], optional = true }
ratatui = { version = "0.28", optional = true }
crossterm = { version = "0.28", optional = true }

[[bin]]
name = "tui"
path = "src/bin/tui.rs"
required-features = ["tui"]

[[bin]]
name = "tui_snapshot"
path = "src/bin/tui_snapshot.rs"
required-features = ["tui"]

[dev-dependencies]
